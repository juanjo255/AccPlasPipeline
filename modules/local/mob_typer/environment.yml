---
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.9
  - conda-forge::numpy=1.23.4
  - conda-forge::pandas=1.5.1
  - conda-forge::scipy=1.13.1
  - conda-forge::biopython=1.85
  - conda-forge::pytables=3.7.0
  - conda-forge::ete3=3.1.3
  - conda-forge::pycurl=7.45.3
  - conda-forge::six=1.17.0
  - conda-forge::pip
  - bioconda::blast=2.15.0
  - bioconda::mash=2.3
  # bioconda's mob_suite runs `mob_init` on install (downloads the full database);
  # install from PyPI instead and pass the existing database with -d
  - pip:
      - mob_suite==3.1.9
